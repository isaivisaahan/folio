name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      # If your files are nested inside a 'folio-mvp' folder, auto-promote them to root
      - name: Check and align repository directory
        run: |
          if [ -d "folio-mvp" ] && [ -f "folio-mvp/package.json" ]; then
            echo "Detected folio-mvp subfolder. Aligning to root..."
            cp -r folio-mvp/* .
            cp -r folio-mvp/.* . 2>/dev/null || true
          fi

      - name: Install dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Generate Android Platform & Sync
        run: |
          npx cap add android
          npx cap sync android

      - name: Set gradlew executable
        run: chmod +x android/gradlew

      - name: Build APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: folio-reader-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
